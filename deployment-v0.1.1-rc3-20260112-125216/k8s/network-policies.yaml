# NetworkPolicies for EZ Platform - OCP Compatible
# Default deny-all with explicit allow rules for service communication

# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ez-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow frontend ingress from external
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 8080

---
# Allow frontend to API services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: datasource-management
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 5001

---
# Allow frontend to metrics API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-metrics
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: metrics-configuration
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: 5002

---
# Allow all services to MongoDB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-mongodb
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: mongodb
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - port: 27017

---
# Allow all services to Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-kafka
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: kafka
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - port: 9092
    - port: 9094

---
# Allow all services to Hazelcast
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-hazelcast
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: hazelcast
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - port: 5701

---
# Allow all services to OTEL Collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-otel
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: otel-collector
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 4317
    - port: 4318

---
# Allow services to Elasticsearch
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-elasticsearch
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 9200

---
# Allow Prometheus to scrape all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      tier: backend
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus-system
    - podSelector:
        matchLabels:
          app: prometheus-business
  policyTypes:
  - Ingress

---
# Allow docs portal ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-docs-ingress
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: docs
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 8080

---
# Allow Grafana ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: ez-platform
spec:
  podSelector:
    matchLabels:
      app: ezplatform-grafana
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 3000
