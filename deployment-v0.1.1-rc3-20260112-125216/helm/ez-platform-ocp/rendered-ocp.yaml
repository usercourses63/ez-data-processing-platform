# Source: ez-platform-ocp/templates/configmaps/services-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: services-config
  namespace: ez-platform
  labels:
    helm.sh/chart: ez-platform-ocp-1.1.0
    app.kubernetes.io/name: ez-platform-ocp
    app.kubernetes.io/instance: ez-platform-ocp
    app.kubernetes.io/version: "v0.1.1-rc2"
    app.kubernetes.io/managed-by: Helm
data:
  # MongoDB Configuration
  mongodb-connection: "mongodb://mongodb-0.mongodb-service.ez-platform.svc.cluster.local:27017,mongodb-1.mongodb-service.ez-platform.svc.cluster.local:27017,mongodb-2.mongodb-service.ez-platform.svc.cluster.local:27017/?replicaSet=rs0&directConnection=true"
  database-name: "ezplatform"

  # Kafka Configuration
  kafka-server: "kafka-0.kafka-service.ez-platform.svc.cluster.local:9092,kafka-1.kafka-service.ez-platform.svc.cluster.local:9092,kafka-2.kafka-service.ez-platform.svc.cluster.local:9092"

  # Hazelcast Configuration
  hazelcast-server: "hazelcast-0.hazelcast-service.ez-platform.svc.cluster.local:5701,hazelcast-1.hazelcast-service.ez-platform.svc.cluster.local:5701,hazelcast-2.hazelcast-service.ez-platform.svc.cluster.local:5701"

  # Hazelcast TTL Configuration
  # Deduplication TTL: How long file hashes are cached to prevent reprocessing
  FileDiscovery__DeduplicationTTLHours: "0.25"

  # Cache TTL: How long file content is cached during processing pipeline
  Hazelcast__CacheTTLHours: "1"

  # Prometheus Configuration
  prometheus-endpoint: "http://prometheus-system.ez-platform.svc.cluster.local:9090"
  prometheus-business-endpoint: "http://prometheus-business.ez-platform.svc.cluster.local:9091"
  prometheus-pushgateway: "http://prometheus-pushgateway.ez-platform.svc.cluster.local:9091"

  # OpenTelemetry Configuration
  otlp-endpoint: "http://otel-collector.ez-platform.svc.cluster.local:4317"

  # Elasticsearch Configuration
  elasticsearch-endpoint: "http://elasticsearch.ez-platform.svc.cluster.local:9200"

  # Logging Configuration
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
  Logging__LogLevel__System: "Warning"

  # Environment
  ASPNETCORE_ENVIRONMENT: "Production"
---
# Source: ez-platform-ocp/templates/deployments/fluent-bit.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: ez-platform
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*ez-platform*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [FILTER]
        Name          modify
        Match         kube.*
        Add           cluster dataprocessing
        Add           environment production

    [OUTPUT]
        Name            es
        Match           kube.*
        Host            elasticsearch
        Port            9200
        Logstash_Format On
        Logstash_Prefix ez-logs
        Replace_Dots    On
        Retry_Limit     5
        Suppress_Type_Name On
        Buffer_Size     512KB

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        serilog
        Format      regex
        Regex       ^\[(?<time>[^\]]+)\s+(?<level>[A-Z]+)\]\s+(?<message>.*)$
        Time_Key    time
        Time_Format %H:%M:%S
---
# Source: ez-platform-ocp/templates/deployments/grafana-deployment.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
  namespace: ez-platform
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # System Prometheus - Infrastructure Metrics
      - name: System-Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-system:9090
        isDefault: false
        editable: false
        uid: system-prometheus-uid
        jsonData:
          timeInterval: 15s
          queryTimeout: 60s
          httpMethod: POST
        version: 1

      # Business Prometheus - Business KPIs
      - name: Business-Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-business:9090
        isDefault: true
        editable: false
        uid: business-prometheus-uid
        jsonData:
          timeInterval: 1m
          queryTimeout: 60s
          httpMethod: POST
        version: 1

      # Elasticsearch - Logs
      - name: Elasticsearch-Logs
        type: elasticsearch
        access: proxy
        url: http://elasticsearch:9200
        database: dataprocessing-logs-*
        isDefault: false
        editable: false
        uid: elasticsearch-logs-uid
        jsonData:
          index: dataprocessing-logs
          interval: Daily
          timeField: "@timestamp"
          esVersion: "8.0.0"
          logMessageField: message
          logLevelField: level
        version: 1
---
# Source: ez-platform-ocp/templates/deployments/otel-collector.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ez-platform
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048

      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      filter/system_metrics:
        metrics:
          include:
            match_type: regexp
            metric_names:
              - '^http[._].*'
              - '^process[._].*'
              - '^dotnet[._].*'
              - '^runtime[._].*'
              - '^aspnetcore[._].*'
              - '^kestrel[._].*'
              - '^system[._].*'
              - '^dns[._].*'
              - '^validation[._].*'

      filter/business_metrics:
        metrics:
          include:
            match_type: regexp
            metric_names:
              - '^business[._].*'

      resource:
        attributes:
          - key: environment
            value: production
            action: upsert
          - key: cluster
            value: dataprocessing
            action: insert
          - key: region
            value: israel
            action: insert

      attributes/timezone:
        actions:
          - key: timezone
            value: "Asia/Jerusalem"
            action: insert

    exporters:
      prometheusremotewrite/system:
        endpoint: http://prometheus-system:9090/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      prometheusremotewrite/business:
        endpoint: http://prometheus-business:9090/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      elasticsearch:
        endpoints:
          - http://elasticsearch:9200
        logs_index: dataprocessing-logs
        traces_index: dataprocessing-traces
        timeout: 30s
        mapping:
          mode: ecs

      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true

      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      pipelines:
        metrics/system:
          receivers: [otlp]
          processors:
            - memory_limiter
            - filter/system_metrics
            - resource
            - attributes/timezone
            - batch
          exporters: [prometheusremotewrite/system]

        metrics/business:
          receivers: [otlp]
          processors:
            - memory_limiter
            - filter/business_metrics
            - resource
            - attributes/timezone
            - batch
          exporters: [prometheusremotewrite/business]

        logs:
          receivers: [otlp]
          processors:
            - memory_limiter
            - resource
            - attributes/timezone
            - batch
          exporters: [elasticsearch]

        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - resource
            - batch
          exporters: [otlp/jaeger, elasticsearch]

      telemetry:
        logs:
          level: info
        metrics:
          level: detailed

      extensions: [health_check, pprof]

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
