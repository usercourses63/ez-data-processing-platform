# Source: ez-platform-ocp/templates/statefulsets/hazelcast-statefulset.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hazelcast-config
  namespace: ez-platform
  labels:
    helm.sh/chart: ez-platform-ocp-1.1.0
    app.kubernetes.io/name: ez-platform-ocp
    app.kubernetes.io/instance: ez-platform-ocp
    app.kubernetes.io/version: "v0.1.1-rc2"
    app.kubernetes.io/managed-by: Helm
    app: hazelcast
    component: cache
data:
  hazelcast.yaml: |
    hazelcast:
      cluster-name: data-processing-cluster
      network:
        join:
          kubernetes:
            enabled: true
            namespace: ez-platform
            service-name: hazelcast-service
      map:
        # File content cache - stores raw file data temporarily
        file-content:
          time-to-live-seconds: 300
          max-idle-seconds: 180
          eviction:
            eviction-policy: LRU
            max-size-policy: USED_HEAP_SIZE
            size: 256
          backup-count: 0

        # Valid records cache - stores validated data temporarily
        valid-records:
          time-to-live-seconds: 300
          max-idle-seconds: 180
          eviction:
            eviction-policy: LRU
            max-size-policy: USED_HEAP_SIZE
            size: 256
          backup-count: 0

        # File deduplication cache - stores file hashes
        file-hashes:
          time-to-live-seconds: 14400
          max-idle-seconds: 7200
          eviction:
            eviction-policy: LRU
            max-size-policy: USED_HEAP_SIZE
            size: 128
          backup-count: 0
