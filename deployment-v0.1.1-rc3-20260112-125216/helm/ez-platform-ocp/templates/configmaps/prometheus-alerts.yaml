# Prometheus Alerting Rules for EZ Platform
# Session 34: Stress Test Recommendations Implementation
#
# Alerts for monitoring processing pipeline health and performance

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: {{ .Values.global.namespace }}
data:
  alerts.yml: |
    groups:
    - name: processing-pipeline
      rules:
      # Alert when RabbitMQ queue depth exceeds threshold
      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages > {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueBacklog.threshold }}
        for: {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueBacklog.duration }}
        labels:
          severity: {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueBacklog.severity }}
        annotations:
          summary: "RabbitMQ queue backlog detected"
          description: "Queue {{"{{ $labels.queue }}"}} has {{"{{ $value }}"}} messages waiting for more than {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueBacklog.duration }}."

      # Alert when queue depth is critically high
      - alert: RabbitMQQueueCritical
        expr: rabbitmq_queue_messages > {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueCritical.threshold }}
        for: {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueCritical.duration }}
        labels:
          severity: {{ .Values.observability.alerts.processingPipeline.rabbitmqQueueCritical.severity }}
        annotations:
          summary: "Critical RabbitMQ queue backlog"
          description: "Queue {{"{{ $labels.queue }}"}} has {{"{{ $value }}"}} messages - immediate attention required."

      # Alert when P99 processing latency is high
      - alert: ProcessingLagHigh
        expr: histogram_quantile(0.99, rate(business_processing_duration_seconds_bucket[5m])) > {{ .Values.observability.alerts.processingPipeline.processingLagHigh.p99Threshold }}
        for: {{ .Values.observability.alerts.processingPipeline.processingLagHigh.duration }}
        labels:
          severity: {{ .Values.observability.alerts.processingPipeline.processingLagHigh.severity }}
        annotations:
          summary: "High processing latency detected"
          description: "P99 processing latency is {{"{{ $value | humanizeDuration }}"}} - above {{ .Values.observability.alerts.processingPipeline.processingLagHigh.p99Threshold }} second threshold."

      # Alert when no files processed for extended period
      - alert: ProcessingStalled
        expr: increase(business_files_processed_total[{{ .Values.observability.alerts.processingPipeline.processingStalled.checkInterval }}]) == 0
        for: {{ .Values.observability.alerts.processingPipeline.processingStalled.duration }}
        labels:
          severity: {{ .Values.observability.alerts.processingPipeline.processingStalled.severity }}
        annotations:
          summary: "File processing has stalled"
          description: "No files have been processed in the last {{ .Values.observability.alerts.processingPipeline.processingStalled.duration }}."

    - name: infrastructure
      rules:
      # Alert when Hazelcast cache memory is high
      - alert: HazelcastMemoryHigh
        expr: hazelcast_memory_used_bytes / hazelcast_memory_max_bytes > {{ .Values.observability.alerts.infrastructure.hazelcastMemoryHigh.threshold }}
        for: {{ .Values.observability.alerts.infrastructure.hazelcastMemoryHigh.duration }}
        labels:
          severity: {{ .Values.observability.alerts.infrastructure.hazelcastMemoryHigh.severity }}
        annotations:
          summary: "Hazelcast memory usage high"
          description: "Hazelcast is using {{"{{ $value | humanizePercentage }}"}} of available memory."

      # Alert when a service pod is not ready
      - alert: PodNotReady
        expr: kube_pod_status_ready{namespace="{{ .Values.global.namespace }}", condition="true"} == 0
        for: {{ .Values.observability.alerts.infrastructure.podNotReady.duration }}
        labels:
          severity: {{ .Values.observability.alerts.infrastructure.podNotReady.severity }}
        annotations:
          summary: "Pod not ready"
          description: "Pod {{"{{ $labels.pod }}"}} in namespace {{"{{ $labels.namespace }}"}} is not ready."

      # Alert when FileProcessor replicas are below minimum
      - alert: FileProcessorScaledDown
        expr: kube_deployment_status_replicas_available{deployment="fileprocessor", namespace="{{ .Values.global.namespace }}"} < {{ .Values.observability.alerts.infrastructure.fileProcessorScaledDown.minReplicas }}
        for: {{ .Values.observability.alerts.infrastructure.fileProcessorScaledDown.duration }}
        labels:
          severity: {{ .Values.observability.alerts.infrastructure.fileProcessorScaledDown.severity }}
        annotations:
          summary: "FileProcessor below recommended replicas"
          description: "FileProcessor has only {{"{{ $value }}"}} replicas available, recommended minimum is {{ .Values.observability.alerts.infrastructure.fileProcessorScaledDown.minReplicas }}."

    - name: validation
      rules:
      # Alert when invalid record rate is high
      - alert: HighInvalidRecordRate
        expr: rate(business_invalid_records_total[5m]) / rate(business_records_processed_total[5m]) > {{ .Values.observability.alerts.validation.highInvalidRecordRate.threshold }}
        for: {{ .Values.observability.alerts.validation.highInvalidRecordRate.duration }}
        labels:
          severity: {{ .Values.observability.alerts.validation.highInvalidRecordRate.severity }}
        annotations:
          summary: "High invalid record rate"
          description: "Invalid record rate is {{"{{ $value | humanizePercentage }}"}} - above {{ .Values.observability.alerts.validation.highInvalidRecordRate.threshold | mulf 100.0 }}% threshold."
