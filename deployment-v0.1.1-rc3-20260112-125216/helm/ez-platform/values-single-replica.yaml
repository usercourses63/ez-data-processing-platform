# EZ Platform - Single Replica Configuration
# Override default values.yaml to run with 1 replica each

# Services - All with 1 replica and latest tags
services:
  datasourceManagement:
    replicas: 1
    image:
      repository: ez-platform/datasource-management
      tag: latest
      pullPolicy: IfNotPresent

  filediscovery:
    replicas: 1
    image:
      repository: ez-platform/filediscovery
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  fileprocessor:
    replicas: 1
    image:
      repository: ez-platform/fileprocessor
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  validation:
    replicas: 1
    image:
      repository: ez-platform/validation
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  output:
    replicas: 1
    image:
      repository: ez-platform/output
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  scheduling:
    replicas: 1
    image:
      repository: ez-platform/scheduling
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  metricsConfiguration:
    replicas: 1
    image:
      repository: ez-platform/metrics-configuration
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  invalidrecords:
    replicas: 1
    image:
      repository: ez-platform/invalidrecords
      tag: v0.1.1-rc3
      pullPolicy: IfNotPresent

  frontend:
    replicas: 1
    image:
      repository: ez-platform/frontend
      tag: latest
      pullPolicy: IfNotPresent

# Infrastructure - Single replicas
mongodb:
  replicas: 1
  external:
    enabled: false

kafka:
  replicas: 1
  config:
    offsetsReplicationFactor: "1"
    transactionStateLogReplicationFactor: "1"
    transactionStateLogMinIsr: "1"
  zookeeper:
    replicas: 1

hazelcast:
  replicas: 1

rabbitmq:
  replicas: 1

# Disable network policies for development
networkPolicies:
  enabled: false

# Ingress disabled (using port-forward)
ingress:
  enabled: false
