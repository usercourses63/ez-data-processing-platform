apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-business-metrics-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
data:
  business-metrics.json: |
    {
      "dashboard": {
        "title": "Business Metrics",
        "uid": "business-metrics",
        "panels": []
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-infrastructure-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
data:
  infrastructure-metrics.json: |
    {
      "dashboard": {
        "title": "Infrastructure Metrics",
        "uid": "infrastructure-metrics",
        "panels": []
      }
    }
