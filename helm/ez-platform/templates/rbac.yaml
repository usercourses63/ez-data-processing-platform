# RBAC configuration for NAS device management and monitoring
# Enables the EZ Platform to dynamically create/manage PV/PVC resources
# and read pod/service status for real-time monitoring via SignalR
---
# ServiceAccount for NAS device management operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nas-device-manager
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    component: nas-device-manager

---
# ClusterRole for PersistentVolume operations (cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nas-pv-manager
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    component: nas-device-manager
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ClusterRoleBinding to link ClusterRole to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nas-device-manager-pv-binding
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    component: nas-device-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nas-pv-manager
subjects:
  - kind: ServiceAccount
    name: nas-device-manager
    namespace: {{ .Values.global.namespace }}

---
# Role for namespace-scoped resources (PVC, Deployments, Pods, Services)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nas-resource-manager
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    component: nas-device-manager
rules:
  # PersistentVolumeClaim management
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Deployment updates (volume mounts)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "update", "patch"]
  # Pod and service monitoring (SignalR real-time updates)
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
  # Metrics API for pod resource usage
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# RoleBinding to link Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nas-device-manager-binding
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    component: nas-device-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nas-resource-manager
subjects:
  - kind: ServiceAccount
    name: nas-device-manager
    namespace: {{ .Values.global.namespace }}
