{{- if .Values.mongodb.enabled }}
# Database initialization hook - runs before services start
# Creates indexes and ensures collections exist
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-db-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-db-init
    spec:
      {{- with .Values.securityContext.pod }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
      - name: wait-for-mongodb
        image: {{ .Values.mongodb.image }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        command:
        - sh
        - -c
        - |
          echo "Waiting for MongoDB to be ready..."
          for i in $(seq 1 60); do
            if mongosh --host mongodb-0.mongodb-service:27017 --eval "db.adminCommand('ping')" --quiet 2>/dev/null; then
              echo "MongoDB is responding to ping!"
              echo "Initiating replica set..."
              mongosh --host mongodb-0.mongodb-service:27017 --eval "
                try {
                  var status = rs.status();
                  print('Replica set already initialized: ' + status.set);
                } catch(e) {
                  print('Initiating replica set...');
                  rs.initiate({_id: '{{ .Values.mongodb.replicaSet | default "rs0" }}', members: [{_id: 0, host: 'mongodb-0.mongodb-service:27017'}]});
                  print('Replica set initiated, waiting for primary...');
                }
              " 2>/dev/null
              sleep 5
              for j in $(seq 1 30); do
                if mongosh --host mongodb-0.mongodb-service:27017 --eval "var s=rs.status(); if(s.myState!==1) throw 'not primary';" --quiet 2>/dev/null; then
                  echo "MongoDB is primary and ready!"
                  exit 0
                fi
                echo "Waiting for primary election... attempt $j/30"
                sleep 2
              done
              echo "MongoDB did not become primary in time"
              exit 1
            fi
            echo "Attempt $i/60 - MongoDB not ready yet, waiting 5s..."
            sleep 5
          done
          echo "MongoDB did not become ready in time"
          exit 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      containers:
      - name: mongo-init
        image: {{ .Values.mongodb.image }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        command:
        - mongosh
        - --host
        - mongodb-0.mongodb-service:27017
        - --eval
        - |
          // EZ Platform Database Initialization
          // Creates indexes and ensures collections exist

          print("Connecting to database: {{ .Values.config.databaseName }}");
          db = db.getSiblingDB("{{ .Values.config.databaseName }}");

          print("Creating/updating indexes...");

          // DataSource collection
          print("  - datasources collection");
          db.datasources.createIndex({ "name": 1 }, { unique: true, background: true });
          db.datasources.createIndex({ "isDeleted": 1 }, { background: true });
          db.datasources.createIndex({ "createdAt": -1 }, { background: true });

          // NAS Devices collection
          print("  - nasdevices collection");
          db.nasdevices.createIndex({ "name": 1 }, { unique: true, background: true });
          db.nasdevices.createIndex({ "isDeleted": 1 }, { background: true });

          // Invalid Records collection
          print("  - invalidrecords collection");
          db.invalidrecords.createIndex({ "dataSourceId": 1 }, { background: true });
          db.invalidrecords.createIndex({ "createdAt": -1 }, { background: true });
          db.invalidrecords.createIndex({ "correlationId": 1 }, { background: true });

          // Schema collection
          print("  - schemas collection");
          db.schemas.createIndex({ "name": 1 }, { unique: true, background: true });
          db.schemas.createIndex({ "dataSourceId": 1 }, { background: true });

          // Processing history collection
          print("  - processinghistory collection");
          db.processinghistory.createIndex({ "dataSourceId": 1, "createdAt": -1 }, { background: true });
          db.processinghistory.createIndex({ "correlationId": 1 }, { background: true });

          print("Database initialization complete!");
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
{{- end }}
