# All Microservices - Kubernetes Service Definitions
# ClusterIP services for internal communication

---
apiVersion: v1
kind: Service
metadata:
  name: filediscovery
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: filediscovery
spec:
  type: ClusterIP
  ports:
  - port: 5007
    targetPort: 5007
    protocol: TCP
    name: http
  selector:
    app: filediscovery

---
apiVersion: v1
kind: Service
metadata:
  name: fileprocessor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: fileprocessor
spec:
  type: ClusterIP
  ports:
  - port: 5008
    targetPort: 5008
    protocol: TCP
    name: http
  selector:
    app: fileprocessor

---
apiVersion: v1
kind: Service
metadata:
  name: validation
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: validation
spec:
  type: ClusterIP
  ports:
  - port: 5003
    targetPort: 5003
    protocol: TCP
    name: http
  selector:
    app: validation

---
apiVersion: v1
kind: Service
metadata:
  name: output
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: output
spec:
  type: ClusterIP
  ports:
  - port: 5009
    targetPort: 5009
    protocol: TCP
    name: http
  selector:
    app: output

---
apiVersion: v1
kind: Service
metadata:
  name: datasource-management
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: datasource-management
spec:
  type: ClusterIP
  ports:
  - port: 5001
    targetPort: 5001
    protocol: TCP
    name: http
  selector:
    app: datasource-management

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-configuration
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: metrics-configuration
spec:
  type: ClusterIP
  ports:
  - port: 5002
    targetPort: 5002
    protocol: TCP
    name: http
  selector:
    app: metrics-configuration

---
apiVersion: v1
kind: Service
metadata:
  name: invalidrecords
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: invalidrecords
spec:
  type: ClusterIP
  ports:
  - port: 5007
    targetPort: 5007
    protocol: TCP
    name: http
  selector:
    app: invalidrecords

---
apiVersion: v1
kind: Service
metadata:
  name: scheduling
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: scheduling
spec:
  type: ClusterIP
  ports:
  - port: 5004
    targetPort: 5004
    protocol: TCP
    name: http
  selector:
    app: scheduling

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: frontend
spec:
  type: {{ .Values.services.frontend.service.type | default "LoadBalancer" }}
  ports:
  - port: {{ .Values.services.frontend.service.port | default 8080 }}
    targetPort: {{ .Values.services.frontend.containerPort | default 8080 }}
    protocol: TCP
    name: http
  selector:
    app: frontend

{{- if .Values.rabbitmq.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
  - port: 5672
    targetPort: 5672
    protocol: TCP
    name: amqp
  - port: 15672
    targetPort: 15672
    protocol: TCP
    name: management
  selector:
    app: rabbitmq
{{- end }}

{{- if .Values.services.docs.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: docs
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
    nodePort: 30800
  selector:
    app: docs
{{- end }}
