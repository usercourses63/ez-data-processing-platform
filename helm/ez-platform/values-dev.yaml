# Development environment overrides for vanilla K8s
# Usage: helm install ez-platform ./helm/ez-platform -f values.yaml -f values-dev.yaml
# Note: Image tags come from values.yaml (production). Dev only reduces replicas and resources.

global:
  namespace: ez-platform

# Reduced replicas for dev (single-node cluster)
services:
  filediscovery:
    replicas: 1
  fileprocessor:
    replicas: 2
  validation:
    replicas: 1
  output:
    replicas: 1
  datasourceManagement:
    replicas: 1
  metricsConfiguration:
    replicas: 1
  invalidrecords:
    replicas: 1
  scheduling:
    replicas: 1
  frontend:
    replicas: 1
  docs:
    replicas: 1

# Single-node infrastructure for dev
mongodb:
  replicas: 1
  storage: 5Gi

kafka:
  replicas: 1
  storage: 5Gi
  zookeeper:
    replicas: 1

hazelcast:
  replicas: 1
  storage: 2Gi

config:
  environment: Development
  logLevel: Debug
