# Development environment overrides for vanilla K8s
# Usage: helm install dev-ez-platform ./helm/ez-platform -f values.yaml -f values-dev.yaml

global:
  namespace: ez-platform-dev

# Reduced replicas for dev
services:
  filediscovery:
    replicas: 1
    image:
      tag: v0.4.0
  fileprocessor:
    replicas: 2
    image:
      tag: v0.4.0
  validation:
    replicas: 1
    image:
      tag: v0.4.0
  output:
    replicas: 1
    image:
      tag: v0.4.0
  datasourceManagement:
    replicas: 1
    image:
      tag: v0.4.0
  metricsConfiguration:
    replicas: 1
    image:
      tag: v0.4.0
  invalidrecords:
    replicas: 1
    image:
      tag: v0.4.0
  scheduling:
    replicas: 1
    image:
      tag: v0.4.0
  frontend:
    replicas: 1
    image:
      tag: v0.4.0
  docs:
    replicas: 1
    image:
      tag: v0.4.0

# Single-node infrastructure for dev
mongodb:
  replicas: 1
  storage: 5Gi

kafka:
  replicas: 1
  storage: 5Gi
  zookeeper:
    replicas: 1

hazelcast:
  replicas: 1
  storage: 2Gi

config:
  environment: Development
  logLevel: Debug
