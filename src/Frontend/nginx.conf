# OCP-compatible nginx configuration
# Listens on non-privileged port 8080

server {
    listen 8080;
    server_name localhost;

    # PID file location (writable by non-root)
    # Note: Main nginx.conf may need pid directive update for non-root

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API proxy - InvalidRecords service
    location /api/v1/invalid-records {
        proxy_pass http://invalidrecords:5006/api/v1/invalid-records;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy - Datasource management and other services
    location /api/ {
        proxy_pass http://datasource-management:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
