# OCP-compatible nginx configuration
# Listens on non-privileged port 8080

server {
    listen 8080;
    server_name localhost;

    # PID file location (writable by non-root)
    # Note: Main nginx.conf may need pid directive update for non-root

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Disable caching for HTML files (always get fresh version)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache static assets (JS, CSS, images) for 7 days with ETag validation
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            etag on;
        }
    }

    # API proxy - InvalidRecords service (5006)
    location /api/v1/invalid-records {
        proxy_pass http://invalidrecords:5006/api/v1/invalid-records;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy - Metrics Configuration service (5002)
    location /api/v1/metrics {
        proxy_pass http://metrics-configuration:5002/api/v1/metrics;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy - Global Alerts (5002)
    location /api/v1/global-alerts {
        proxy_pass http://metrics-configuration:5002/api/v1/global-alerts;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy - Scheduling service (5004)
    location /api/v1/scheduling {
        proxy_pass http://scheduling:5004/api/v1/scheduling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API proxy - Schema service (proxied through datasource-management for now)
    location /api/v1/schema {
        proxy_pass http://datasource-management:5001/api/v1/schema;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SignalR hub proxy with WebSocket support (v0.2.0: MON-07)
    location /hubs/ {
        proxy_pass http://datasource-management:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy - Datasource management and other services (default fallback)
    location /api/ {
        proxy_pass http://datasource-management:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
