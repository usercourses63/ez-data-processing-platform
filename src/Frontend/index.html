<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="EZ Data Processing Platform" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>EZ Data Processing Platform</title>

    <!-- Runtime config (generated at container start by docker-entrypoint.sh; stubbed empty in dev) -->
    <script src="/config.js"></script>

    <style>
      body {
        margin: 0;
        font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Direction is controlled at runtime by React (App.tsx) via document.documentElement.dir.
           Do not hardcode direction/text-align here — it traps the body in RTL even after switching to English. */
      }

      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }

      /* RTL overrides for Ant Design — gated to Hebrew mode only.
         Without the [dir='rtl'] qualifier these force RTL on Antd components even in English. */
      html[dir='rtl'] .ant-layout,
      html[dir='rtl'] .ant-menu-horizontal,
      html[dir='rtl'] .ant-table {
        direction: rtl;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app. &nbsp; / &nbsp; עליך להפעיל JavaScript כדי להריץ אפליקציה זו.</noscript>
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
