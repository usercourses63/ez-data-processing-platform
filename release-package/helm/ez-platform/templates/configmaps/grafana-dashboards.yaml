{{- if .Values.observability.grafana.enabled }}
# Grafana dashboard ConfigMaps (provider + business + infrastructure).
# The grafana Deployment mounts these three by name; without them the pod hangs in
# ContainerCreating (FailedMount). Dashboard JSON lives under dashboards/ and is injected
# via .Files.Get so Helm does NOT try to evaluate Grafana's double-brace legend syntax as
# template directives.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: grafana
data:
  dashboards.yaml: |
{{ .Files.Get "dashboards/dashboards-provider.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-business-metrics-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: grafana
data:
  business-metrics.json: |
{{ .Files.Get "dashboards/business-metrics.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-infrastructure-dashboard
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: grafana
data:
  infrastructure-metrics.json: |
{{ .Files.Get "dashboards/infrastructure-metrics.json" | indent 4 }}
{{- end }}
