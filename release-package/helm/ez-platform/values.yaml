# EZ Platform - Helm Chart Values
# Default configuration for production deployment

global:
  namespace: ez-platform
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent

# OCP Compatibility Settings
ocp:
  enabled: false  # Set to true for OpenShift deployments
  routes:
    enabled: false
    tls:
      termination: edge

# Global Security Context (OCP-compatible)
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Network Policies
networkPolicies:
  enabled: true

# Microservices Configuration
services:
  filediscovery:
    enabled: true
    replicas: 2
    image:
      repository: ez-platform/filediscovery
      tag: latest
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  fileprocessor:
    enabled: true
    replicas: 5
    image:
      repository: ez-platform/fileprocessor
      tag: latest
    strategy:
      maxSurge: 2
      maxUnavailable: 1
    config:
      concurrentFiles: "10"
      maxFileSizeMB: "1000"
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  validation:
    enabled: true
    replicas: 3
    image:
      repository: ez-platform/validation
      tag: latest
    strategy:
      maxSurge: 2
      maxUnavailable: 1
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 3000m
        memory: 6Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  output:
    enabled: true
    replicas: 3
    image:
      repository: ez-platform/output
      tag: latest
    strategy:
      maxSurge: 2
      maxUnavailable: 1
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  datasourceManagement:
    enabled: true
    replicas: 2
    image:
      repository: ez-platform/datasource-management
      tag: latest
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  metricsConfiguration:
    enabled: true
    replicas: 2
    image:
      repository: ez-platform/metrics-configuration
      tag: latest
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  invalidrecords:
    enabled: true
    replicas: 2
    image:
      repository: ez-platform/invalidrecords
      tag: latest
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  scheduling:
    enabled: true
    replicas: 1
    image:
      repository: ez-platform/scheduling
      tag: latest
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

  frontend:
    enabled: true
    replicas: 2
    image:
      repository: frontend
      tag: latest
      pullPolicy: IfNotPresent
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    config:
      apiBaseUrl: "http://datasource-management:5001"
      # Override the documentation portal URL at deploy time.
      # Empty value → frontend falls back to auto-detect (http://{hostname}:30800 for private nets, /docs otherwise).
      # Example: --set services.frontend.config.docsUrl=https://docs.mycompany.internal
      docsUrl: ""
    service:
      type: LoadBalancer
      port: 80
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    extraEnv: []

# Infrastructure Configuration
mongodb:
  enabled: true
  replicas: 3
  image: mongo:8.0
  replicaSet: rs0
  storage: 20Gi
  storageClass: standard
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  extraEnv: []
  external:
    enabled: false
    connectionString: ""

kafka:
  enabled: true
  replicas: 3
  image: confluentinc/cp-kafka:7.5.0
  storage: 10Gi
  storageClass: standard
  config:
    offsetsReplicationFactor: "1"
    transactionStateLogReplicationFactor: "1"
    transactionStateLogMinIsr: "1"
    logRetentionHours: "168"
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  zookeeper:
    enabled: true
    replicas: 1
    image: confluentinc/cp-zookeeper:7.5.0
    storage: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    extraEnv: []
  extraEnv: []
  external:
    enabled: false
    bootstrapServers: ""

hazelcast:
  enabled: true
  replicas: 3
  image: hazelcast/hazelcast:5.6
  clusterName: data-processing-cluster
  storage: 5Gi
  storageClass: standard
  jvm:
    minMemory: 256m
    maxMemory: 512m
  resources:
    requests:
      cpu: 1000m
      memory: 8Gi
    limits:
      cpu: 2000m
      memory: 10Gi
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 5
  maps:
    fileContent:
      ttlSeconds: 300
      maxIdleSeconds: 180
      maxSizeMB: 256
      backupCount: 0
    validRecords:
      ttlSeconds: 300
      maxIdleSeconds: 180
      maxSizeMB: 256
      backupCount: 0
    fileHashes:
      ttlSeconds: 14400
      maxIdleSeconds: 7200
      maxSizeMB: 128
      backupCount: 0
  extraEnv: []
  external:
    enabled: false
    members: ""

# Storage Configuration
storage:
  dataInput:
    enabled: true
    size: 50Gi
    storageClass: standard
  dataOutput:
    enabled: true
    size: 100Gi
    storageClass: standard
  externalData:
    enabled: true
    hostPath: /mnt/external-test-data

# Configuration
config:
  environment: Production
  databaseName: ezplatform
  logLevel: Information
  logLevelMicrosoft: Warning
  logLevelSystem: Warning

  # File Discovery Configuration
  fileDiscovery:
    deduplicationTTLHours: "0.25"  # 15 min for testing, 4-24 hours for production

  # Hazelcast Configuration
  hazelcast:
    cacheTTLHours: "1"

# Observability Configuration
observability:
  # Prometheus System - Infrastructure Metrics
  prometheusSystem:
    enabled: true
    replicas: 1
    image:
      registry: docker.io  # Pinned per-image: don't depend on global.imageRegistry fallback
      repository: prom/prometheus
      tag: v2.53.0  # Pinned version (was :latest)
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    config:
      scrapeInterval: 15s
      evaluationInterval: 15s
      retentionTime: 15d
      retentionSize: ""
      enableRemoteWrite: true
    storage:
      size: 50Gi
      storageClass: standard
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    service:
      type: ClusterIP
      port: 9090
    external:
      enabled: false
      endpoint: ""
    extraEnv: []

  # Prometheus Business - Business KPIs
  prometheusBusiness:
    enabled: true
    replicas: 1
    image:
      registry: docker.io  # Pinned per-image: don't depend on global.imageRegistry fallback
      repository: prom/prometheus
      tag: v2.53.0  # Pinned version (was :latest)
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    config:
      scrapeInterval: 15s
      evaluationInterval: 15s
      retentionTime: 15d
      retentionSize: ""
      enableRemoteWrite: true
    storage:
      size: 50Gi
      storageClass: standard
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    service:
      type: ClusterIP
      port: 9090
    external:
      enabled: false
      endpoint: ""
    extraEnv: []

  # Grafana - Visualization and Dashboards
  grafana:
    enabled: true
    replicas: 1
    image:
      registry: docker.io  # Pinned per-image: don't depend on global.imageRegistry fallback
      repository: grafana/grafana
      tag: "10.4.1"  # LTS version (was :latest)
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    auth:
      adminUser: admin
      adminPassword: ""  # Empty = auto-generate random 32-char password
      existingSecret: ""  # For external secret management (Vault, Sealed Secrets)
      existingSecretKey: "admin-password"
    datasources:
      systemPrometheus:
        enabled: true
        url: "http://prometheus-system:9090"
        isDefault: false
        timeInterval: 15s
      businessPrometheus:
        enabled: true
        url: "http://prometheus-business:9090"
        isDefault: true
        timeInterval: 1m
      elasticsearch:
        enabled: true
        url: "http://elasticsearch:9200"
        index: "dataprocessing-logs"
    storage:
      size: 10Gi
      storageClass: standard
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    service:
      type: LoadBalancer
      port: 3000
    external:
      enabled: false
      url: ""
    extraEnv: []

  # Elasticsearch - Log Storage
  elasticsearch:
    enabled: true
    replicas: 1
    image:
      repository: docker.elastic.co/elasticsearch/elasticsearch
      tag: "8.17.0"  # Already pinned
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    config:
      discoveryType: single-node
      javaOpts: "-Xms1g -Xmx1g"
      clusterName: ez-platform-logs
    security:
      enabled: false  # Dev default - MUST enable for production
      existingSecret: ""  # For production credentials
      username: elastic
    storage:
      size: 50Gi
      storageClass: standard
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    service:
      type: ClusterIP
      port: 9200
    external:
      enabled: false
      endpoint: ""
    extraEnv: []

  # Jaeger - Distributed Tracing
  jaeger:
    enabled: true
    replicas: 1
    image:
      registry: docker.io  # Pinned per-image: don't depend on global.imageRegistry fallback
      repository: jaegertracing/all-in-one
      tag: "1.62.0"  # Pinned version (was :latest)
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    config:
      storage:
        type: elasticsearch
        elasticsearchServerUrls: "http://elasticsearch:9200"
        elasticsearchIndexPrefix: "jaeger"
      sampling:
        defaultStrategy: probabilistic
        defaultParam: "1.0"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    service:
      type: ClusterIP
      ports:
        otlpGrpc: 4317
        otlpHttp: 4318
        ui: 16686
        zipkin: 9411
    external:
      enabled: false
      endpoint: ""
    extraEnv: []

  # OTEL Collector - Telemetry Aggregation
  otelCollector:
    enabled: true
    replicas: 1
    image:
      registry: docker.io  # Pinned per-image: don't depend on global.imageRegistry fallback
      repository: otel/opentelemetry-collector-contrib
      tag: "0.113.0"  # Pinned version (was :latest)
    strategy:
      maxSurge: 1
      maxUnavailable: 0
    processors:
      batch:
        timeout: 10s
        sendBatchSize: 1024
        sendBatchMaxSize: 2048
      memoryLimiter:
        checkInterval: 1s
        limitMiB: 512
        spikeLimitMiB: 128
      resource:
        environment: production
        cluster: dataprocessing
        region: israel
        timezone: "Asia/Jerusalem"
    exporters:
      prometheusSystemEndpoint: "http://prometheus-system:9090/api/v1/write"
      prometheusBusinessEndpoint: "http://prometheus-business:9090/api/v1/write"
      elasticsearchEndpoint: "http://elasticsearch:9200"
      elasticsearchLogsIndex: "dataprocessing-logs"
      elasticsearchTracesIndex: "dataprocessing-traces"
      jaegerEndpoint: "jaeger:4317"
      timeout: 30s
      retryEnabled: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    service:
      type: ClusterIP
      ports:
        otlpGrpc: 4317
        otlpHttp: 4318
        metrics: 8888
    external:
      enabled: false
      endpoint: ""
    extraEnv: []

  # Fluent-Bit - Log Collection
  fluentBit:
    enabled: true
    image:
      registry: docker.io  # Pinned per-image: don't depend on global.imageRegistry fallback
      repository: fluent/fluent-bit
      tag: "3.2.2"  # Pinned version (was :latest)
    config:
      flush: 5
      logLevel: info
      tailPath: "/var/log/containers/*ez-platform*.log"
      memBufLimit: 50MB
      elasticsearchHost: elasticsearch
      elasticsearchPort: 9200
      logstashPrefix: "ez-logs"
      bufferSize: 512KB
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    extraEnv: []

  # Alert Rules Configuration
  alerts:
    enabled: true
    processingPipeline:
      rabbitmqQueueBacklog:
        threshold: 100
        duration: 5m
        severity: warning
      rabbitmqQueueCritical:
        threshold: 500
        duration: 2m
        severity: critical
      processingLagHigh:
        p99Threshold: 60  # seconds
        duration: 5m
        severity: warning
      processingStalled:
        checkInterval: 10m
        duration: 10m
        severity: critical
    infrastructure:
      hazelcastMemoryHigh:
        threshold: 0.85
        duration: 5m
        severity: warning
      podNotReady:
        duration: 5m
        severity: warning
      fileProcessorScaledDown:
        minReplicas: 2
        duration: 5m
        severity: warning
    validation:
      highInvalidRecordRate:
        threshold: 0.1  # 10%
        duration: 5m
        severity: warning

# Service-Specific Configuration (added for each service)
# FileProcessor
fileprocessor:
  config:
    concurrentFiles: "10"
    maxFileSizeMB: "1000"

# Frontend
frontend:
  config:
    apiBaseUrl: "http://datasource-management:5001"

# Health Probes (apply to all services)
defaultProbes:
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# Rolling Update Strategy (defaults)
defaultStrategy:
  maxSurge: 1
  maxUnavailable: 0
