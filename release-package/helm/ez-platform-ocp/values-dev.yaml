# Development environment overrides for OpenShift
# Usage: helm install dev-ez-platform ./release-package/helm/ez-platform-ocp -f values.yaml -f values-dev.yaml

global:
  namespace: ez-platform-dev

ocp:
  enabled: true
  domain: apps.dev.example.com  # Update with actual dev cluster domain

# Reduced replicas for dev
services:
  filediscovery:
    replicas: 1
    image:
      tag: v0.2.0
  fileprocessor:
    replicas: 2
    image:
      tag: v0.2.0
  validation:
    replicas: 1
    image:
      tag: v0.2.0
  output:
    replicas: 1
    image:
      tag: v0.2.0
  datasourceManagement:
    replicas: 1
    image:
      tag: v0.2.0
  metricsConfiguration:
    replicas: 1
    image:
      tag: v0.2.0
  invalidrecords:
    replicas: 1
    image:
      tag: v0.2.0
  scheduling:
    replicas: 1
    image:
      tag: v0.2.0
  frontend:
    replicas: 1
    image:
      tag: v0.2.0
  docs:
    replicas: 1
    image:
      tag: v0.2.0

# Single-node infrastructure for dev
mongodb:
  replicas: 1
  storage: 5Gi

kafka:
  replicas: 1
  storage: 5Gi
  zookeeper:
    replicas: 1

hazelcast:
  replicas: 1
  storage: 2Gi

config:
  environment: Development
  logLevel: Debug
