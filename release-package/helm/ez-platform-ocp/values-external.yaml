# External Observability Mode
# Usage: helm install ez-platform ./ez-platform-ocp -f values.yaml -f values-external.yaml
#
# Use this when you want to send telemetry to external services like:
# - Grafana Cloud
# - Datadog
# - New Relic
# - Elastic Cloud
# - Managed Prometheus (AWS AMP, Azure Monitor, GCP Managed Prometheus)

# Disable internal observability stack
observability:
  prometheusSystem:
    enabled: false  # Use external Prometheus
    external:
      enabled: true
      endpoint: "https://prometheus-prod.example.com"  # Replace with your endpoint

  prometheusBusiness:
    enabled: false  # Use external Prometheus
    external:
      enabled: true
      endpoint: "https://prometheus-prod.example.com"

  grafana:
    enabled: false  # Use external Grafana
    external:
      enabled: true
      url: "https://grafana.example.com"  # Replace with your URL

  elasticsearch:
    enabled: false  # Use external Elasticsearch/Elastic Cloud
    external:
      enabled: true
      endpoint: "https://elasticsearch.example.com:9200"
      # Configure credentials via existingSecret
      existingSecret: "elasticsearch-external-secret"

  jaeger:
    enabled: false  # Use external tracing (Jaeger SaaS, Tempo, Datadog APM)
    external:
      enabled: true
      endpoint: "https://jaeger.example.com:4317"

  # Keep OTEL Collector as aggregation layer
  otelCollector:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    processors:
      batch:
        timeout: 10s
        sendBatchSize: 1024
      memoryLimiter:
        limitMiB: 512
      resource:
        environment: production
        cluster: external-cluster
        region: us-east-1  # Update as needed
    exporters:
      # Configure external endpoints
      prometheusSystemEndpoint: "https://prometheus-prod.example.com/api/v1/write"
      prometheusBusinessEndpoint: "https://prometheus-prod.example.com/api/v1/write"
      elasticsearchEndpoint: "https://elasticsearch.example.com:9200"
      elasticsearchLogsIndex: "ez-platform-logs"
      elasticsearchTracesIndex: "ez-platform-traces"
      jaegerEndpoint: "jaeger.example.com:4317"
      timeout: 60s  # Longer timeout for external services
      retryEnabled: true

  # Disable Fluent-Bit (use external log aggregator)
  fluentBit:
    enabled: false

  # Alerts are managed externally
  alerts:
    enabled: false

# Example: Grafana Cloud Configuration
# Uncomment and configure if using Grafana Cloud:
#
# observability:
#   otelCollector:
#     exporters:
#       prometheusSystemEndpoint: "https://prometheus-prod-XX-prod-us-central-0.grafana.net/api/prom/push"
#       prometheusBusinessEndpoint: "https://prometheus-prod-XX-prod-us-central-0.grafana.net/api/prom/push"
#       # Authentication via bearer token in existingSecret
#     extraEnv:
#       - name: GRAFANA_CLOUD_TOKEN
#         valueFrom:
#           secretKeyRef:
#             name: grafana-cloud-secret
#             key: token

# Example: Datadog Configuration
# Uncomment and configure if using Datadog:
#
# observability:
#   otelCollector:
#     enabled: true
#     exporters:
#       datadogEndpoint: "https://api.datadoghq.com"
#       datadogApiKey:
#         existingSecret: "datadog-secret"
#         existingSecretKey: "api-key"

# Example: Elastic Cloud Configuration
# Uncomment and configure if using Elastic Cloud:
#
# observability:
#   elasticsearch:
#     external:
#       enabled: true
#       endpoint: "https://XXXXX.es.us-central1.gcp.cloud.es.io:9243"
#       existingSecret: "elastic-cloud-secret"
#   jaeger:
#     config:
#       storage:
#         type: elasticsearch
#         elasticsearchServerUrls: "https://XXXXX.es.us-central1.gcp.cloud.es.io:9243"

# Keep microservices enabled (they generate metrics)
services:
  datasourceManagement:
    enabled: true
  validation:
    enabled: true
  fileprocessor:
    enabled: true
  filediscovery:
    enabled: true
  scheduling:
    enabled: true
  output:
    enabled: true
  metricsconfiguration:
    enabled: true
  invalidrecords:
    enabled: true
  frontend:
    enabled: true
