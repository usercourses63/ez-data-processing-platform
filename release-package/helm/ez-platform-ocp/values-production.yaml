# EZ Platform (OpenShift) - Production Values
# Usage: helm install ez-platform ./ez-platform-ocp -f values-production.yaml
# Helm always auto-loads the base values.yaml first; this file overlays only the
# production-specific differences (HA replicas, larger resources, image tags,
# readOnlyRootFilesystem, docsUrl, strict alert thresholds).
#
# OUT OF SCOPE CAVEAT: Upstream infrastructure images (mongo/kafka/elasticsearch/
# rabbitmq) on OpenShift restricted-v2 may still need a more permissive SCC or an
# operator-based install — that is NOT handled by this chart. This chart makes the
# 10 EZ app/docs pods restricted-v2 compliant; the infra images are out of scope.

# OCP Compatibility Settings
ocp:
  enabled: true
  domain: apps.<your-cluster-domain>  # PLACEHOLDER — replace with your OpenShift cluster apps domain

# Microservices Configuration — production image tags
services:
  filediscovery:
    image:
      tag: ocp-20260621
  fileprocessor:
    image:
      tag: ocp-20260621
  validation:
    image:
      tag: ocp-20260621
  output:
    image:
      tag: ocp-20260621
  datasourceManagement:
    image:
      tag: ocp-20260621
  metricsConfiguration:
    image:
      tag: ocp-20260621
  invalidrecords:
    image:
      tag: ocp-20260621
  scheduling:
    image:
      tag: ocp-20260621
  frontend:
    image:
      tag: ocp-20260621
    config:
      # Documentation portal URL exposed to the frontend (rendered as EZ_DOCS_URL).
      # Empty value → frontend auto-detects. Set to the docs Route for production.
      docsUrl: "https://ezdocs.apps.<your-cluster-domain>"
      # Backend service URLs proxied by the frontend nginx. These default to the
      # in-cluster Service names; override here if backends live in a different
      # namespace or are reached via external hostnames.
      backends:
        datasource: "http://datasource-management:5001"
        invalidRecords: "http://invalidrecords:5007"
        metrics: "http://metrics-configuration:5002"
        scheduling: "http://scheduling:5004"
  docs:
    image:
      tag: ocp-20260621

# Security hardening
# NOTE: pod runAsUser/runAsGroup/fsGroup are intentionally NOT set here — OpenShift
# restricted-v2 SCC assigns them per namespace. This file must never reintroduce the pins.
securityContext:
  container:
    # readOnlyRootFilesystem MUST be false: nginx writes config.js into the html dir at
    # startup, and the .NET services write DataProtection keys under /app at runtime.
    readOnlyRootFilesystem: false

# Production application configuration
config:
  environment: Production
  logLevel: Information
  fileDiscovery:
    deduplicationTTLHours: "4"  # Production: 4 hours

# Production hardening with HA and larger resources
observability:
  prometheusSystem:
    replicas: 2  # High availability
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    storage:
      size: 200Gi
      storageClass: fast-ssd  # Premium storage
    config:
      retentionTime: 30d  # Longer retention
      scrapeInterval: 10s  # More frequent scraping
      evaluationInterval: 10s

  prometheusBusiness:
    replicas: 2  # High availability
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    storage:
      size: 200Gi
      storageClass: fast-ssd
    config:
      retentionTime: 30d
      scrapeInterval: 10s
      evaluationInterval: 10s

  grafana:
    replicas: 2  # High availability
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    storage:
      size: 20Gi
      storageClass: fast-ssd
    auth:
      # Use external secret management in production
      existingSecret: "grafana-vault-secret"
      existingSecretKey: "admin-password"

  elasticsearch:
    replicas: 3  # Cluster mode
    resources:
      requests:
        cpu: 2000m
        memory: 8Gi
      limits:
        cpu: 4000m
        memory: 16Gi
    storage:
      size: 500Gi
      storageClass: fast-ssd
    config:
      javaOpts: "-Xms4g -Xmx4g"  # Large heap
    security:
      enabled: true  # Enable security in production
      existingSecret: "elasticsearch-vault-secret"
      username: elastic

  jaeger:
    replicas: 2  # High availability
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    config:
      storage:
        type: elasticsearch  # Persist traces
        elasticsearchServerUrls: "http://elasticsearch:9200"
        elasticsearchIndexPrefix: "jaeger-prod"

  otelCollector:
    replicas: 3  # High throughput
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    processors:
      batch:
        timeout: 5s  # Faster batching
        sendBatchSize: 2048
        sendBatchMaxSize: 4096
      memoryLimiter:
        limitMiB: 1024
        spikeLimitMiB: 256
      resource:
        environment: production  # Tag as production

  fluentBit:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config:
      flush: 3  # More frequent flushing
      memBufLimit: 100MB  # Larger buffer

  # Strict alert thresholds for production
  alerts:
    processingPipeline:
      rabbitmqQueueBacklog:
        threshold: 100
        duration: 2m  # Alert faster
        severity: warning
      rabbitmqQueueCritical:
        threshold: 500
        duration: 1m  # Alert immediately
        severity: critical
      processingLagHigh:
        p99Threshold: 30  # Stricter SLA (30 seconds)
        duration: 2m
        severity: critical
      processingStalled:
        duration: 5m  # Alert quickly
        severity: critical
    infrastructure:
      hazelcastMemoryHigh:
        threshold: 0.80  # Alert earlier (80%)
        duration: 2m
        severity: warning
      podNotReady:
        duration: 2m  # Alert quickly
        severity: critical
      fileProcessorScaledDown:
        minReplicas: 3  # Require 3+ replicas
        duration: 2m
        severity: critical
    validation:
      highInvalidRecordRate:
        threshold: 0.05  # Stricter threshold (5%)
        duration: 2m
        severity: critical

# Resource quotas for production
global:
  imagePullPolicy: IfNotPresent
  namespace: ez-platform-prod
