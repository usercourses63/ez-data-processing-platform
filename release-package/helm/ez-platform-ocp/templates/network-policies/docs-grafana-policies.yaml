{{- if .Values.networkPolicies.enabled }}
{{- if .Values.networkPolicies.docs.allowExternal }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-docs-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: docs
  ingress:
  - from: []
    ports:
    - port: 8080
      protocol: TCP
{{- end }}

{{- if .Values.networkPolicies.grafana.allowExternal }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: grafana
  ingress:
  - from: []
    ports:
    - port: 3000
      protocol: TCP
{{- end }}
{{- end }}
