{{- if .Values.observability.elasticsearch.enabled }}
# Elasticsearch - Kubernetes Deployment
# Log storage and search

apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: elasticsearch
    component: logging
spec:
  type: {{ .Values.observability.elasticsearch.service.type }}
  ports:
  - port: {{ .Values.observability.elasticsearch.service.port }}
    targetPort: {{ .Values.observability.elasticsearch.service.port }}
    name: http
  selector:
    app: elasticsearch

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: elasticsearch
    component: logging
spec:
  replicas: {{ .Values.observability.elasticsearch.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.observability.elasticsearch.strategy.maxSurge | default 1 }}
      maxUnavailable: {{ .Values.observability.elasticsearch.strategy.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        component: logging
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.pod.runAsNonRoot | default true }}
        runAsUser: {{ .Values.securityContext.pod.runAsUser | default 1000 }}
        runAsGroup: {{ .Values.securityContext.pod.runAsGroup | default 1000 }}
        fsGroup: {{ .Values.securityContext.pod.fsGroup | default 1000 }}
        seccompProfile:
          type: {{ .Values.securityContext.pod.seccompProfile.type | default "RuntimeDefault" }}
      containers:
      - name: elasticsearch
        securityContext:
          allowPrivilegeEscalation: {{ .Values.securityContext.container.allowPrivilegeEscalation | default false }}
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              {{- toYaml .Values.securityContext.container.capabilities.drop | nindent 14 }}
        image: {{ include "ez-platform.image" (dict "Values" .Values "image" .Values.observability.elasticsearch.image "Chart" .Chart) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.observability.elasticsearch.service.port }}
          name: http
        env:
        - name: discovery.type
          value: {{ .Values.observability.elasticsearch.config.discoveryType | quote }}
        - name: xpack.security.enabled
          value: {{ .Values.observability.elasticsearch.security.enabled | quote }}
        {{- if .Values.observability.elasticsearch.security.enabled }}
        {{- if .Values.observability.elasticsearch.security.existingSecret }}
        - name: ELASTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.observability.elasticsearch.security.existingSecret }}
              key: elastic-password
        {{- end }}
        {{- end }}
        - name: ES_JAVA_OPTS
          value: {{ .Values.observability.elasticsearch.config.javaOpts | quote }}
        - name: cluster.name
          value: {{ .Values.observability.elasticsearch.config.clusterName | quote }}
        {{- with .Values.observability.elasticsearch.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.observability.elasticsearch.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /_cluster/health
            port: {{ .Values.observability.elasticsearch.service.port }}
          initialDelaySeconds: {{ .Values.observability.elasticsearch.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.observability.elasticsearch.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.observability.elasticsearch.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.observability.elasticsearch.livenessProbe.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /_cluster/health
            port: {{ .Values.observability.elasticsearch.service.port }}
          initialDelaySeconds: {{ .Values.observability.elasticsearch.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.observability.elasticsearch.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.observability.elasticsearch.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.observability.elasticsearch.readinessProbe.failureThreshold }}
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
      volumes:
      - name: elasticsearch-data
        persistentVolumeClaim:
          claimName: elasticsearch-data-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: elasticsearch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.observability.elasticsearch.storage.size }}
  storageClassName: {{ .Values.observability.elasticsearch.storage.storageClass }}
{{- end }}
