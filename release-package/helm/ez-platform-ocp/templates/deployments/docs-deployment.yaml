{{- if .Values.services.docs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app: docs
    tier: frontend
spec:
  replicas: {{ .Values.services.docs.replicas }}
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
        tier: frontend
    spec:
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      containers:
      - name: docs
        image: {{ .Values.services.docs.image.repository }}:{{ .Values.services.docs.image.tag }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext.container | nindent 10 }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          {{- toYaml .Values.services.docs.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: docs-tmp
          mountPath: /tmp
      volumes:
      - name: docs-tmp
        emptyDir: {}
{{- end }}
