{{- if .Values.ocp.enabled }}
{{- if .Values.ocp.routes.enabled }}
{{- if .Values.services.docs.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: docs
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ez-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: ezplatform-docs
    app.kubernetes.io/component: documentation
  annotations:
    # Preserve path for Docusaurus (baseUrl: '/docs/')
    haproxy.router.openshift.io/rewrite-target: /docs
spec:
  # Same host as frontend, different path
  host: {{ .Values.ocp.domain }}
  # Route /docs/* requests to docs service
  path: /docs
  to:
    kind: Service
    name: ezplatform-docs
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: {{ .Values.ocp.routes.tls.termination | default "edge" }}
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
{{- end }}
{{- end }}
