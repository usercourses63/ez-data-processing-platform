<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="10" y="10" width="680" height="380" fill="white" stroke="#d9d9d9" rx="8"/>
  <text x="350" y="40" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">NasDevicesTab - LTR Mode</text>

  <!-- Header -->
  <rect x="30" y="60" width="640" height="50" fill="white"/>
  <text x="50" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#333">NAS Device Management</text>
  <text x="50" y="100" font-family="Arial" font-size="10" fill="#52c41a">2 provisioned | 1 pending</text>
  <rect x="550" y="70" width="120" height="32" fill="#1890ff" rx="4"/>
  <text x="610" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="white">+ Add NAS Device</text>

  <!-- Table header -->
  <rect x="30" y="120" width="640" height="35" fill="#fafafa" stroke="#d9d9d9"/>
  <text x="50" y="142" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Name</text>
  <text x="180" y="142" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Server</text>
  <text x="320" y="142" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Export Path</text>
  <text x="450" y="142" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Status</text>
  <text x="570" y="142" font-family="Arial" font-size="11" font-weight="bold" fill="#333">Actions</text>

  <!-- Row 1 -->
  <rect x="30" y="155" width="640" height="50" fill="white" stroke="#f0f0f0"/>
  <text x="50" y="185" font-family="Arial" font-size="11" fill="#333">Production NAS</text>
  <text x="180" y="185" font-family="monospace" font-size="10" fill="#666">192.168.1.100</text>
  <text x="320" y="185" font-family="monospace" font-size="10" fill="#666">/exports/data</text>
  <rect x="450" y="170" width="80" height="22" fill="#f6ffed" stroke="#b7eb8f" rx="4"/>
  <text x="490" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#52c41a">Provisioned</text>
  <text x="570" y="185" font-family="Arial" font-size="10" fill="#1890ff">Edit | Test | Delete</text>

  <!-- Row 2 -->
  <rect x="30" y="205" width="640" height="50" fill="#fafafa" stroke="#f0f0f0"/>
  <text x="50" y="235" font-family="Arial" font-size="11" fill="#333">Backup NAS</text>
  <text x="180" y="235" font-family="monospace" font-size="10" fill="#666">192.168.1.101</text>
  <text x="320" y="235" font-family="monospace" font-size="10" fill="#666">/exports/backup</text>
  <rect x="450" y="220" width="80" height="22" fill="#f6ffed" stroke="#b7eb8f" rx="4"/>
  <text x="490" y="235" text-anchor="middle" font-family="Arial" font-size="10" fill="#52c41a">Provisioned</text>
  <text x="570" y="235" font-family="Arial" font-size="10" fill="#1890ff">Edit | Test | Delete</text>

  <!-- Row 3 -->
  <rect x="30" y="255" width="640" height="50" fill="white" stroke="#f0f0f0"/>
  <text x="50" y="285" font-family="Arial" font-size="11" fill="#333">Archive NAS</text>
  <text x="180" y="285" font-family="monospace" font-size="10" fill="#666">192.168.1.102</text>
  <text x="320" y="285" font-family="monospace" font-size="10" fill="#666">/exports/archive</text>
  <rect x="450" y="270" width="80" height="22" fill="#fffbe6" stroke="#ffe58f" rx="4"/>
  <text x="490" y="285" text-anchor="middle" font-family="Arial" font-size="10" fill="#faad14">Pending</text>
  <text x="570" y="285" font-family="Arial" font-size="10" fill="#1890ff">Provision | Edit</text>

  <text x="350" y="390" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Placeholder - Replace with actual screenshot</text>
</svg>
