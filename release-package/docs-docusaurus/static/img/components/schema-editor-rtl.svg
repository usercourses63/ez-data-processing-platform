<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="10" y="10" width="680" height="430" fill="white" stroke="#d9d9d9" rx="8"/>
  <text x="350" y="40" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">SchemaEditorPage - RTL Mode (Hebrew)</text>

  <!-- Header card (RTL) -->
  <rect x="30" y="60" width="640" height="60" fill="white" stroke="#d9d9d9" rx="4"/>
  <rect x="575" y="75" width="80" height="28" fill="#f5f5f5" stroke="#d9d9d9" rx="4"/>
  <text x="615" y="93" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">חזור לרשימה</text>
  <text x="550" y="90" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold" fill="#333">סכמת נתוני מכירות</text>
  <text x="550" y="105" text-anchor="end" font-family="Arial" font-size="10" fill="#999">sales_schema_v1 - גרסה 3</text>
  <rect x="40" y="75" width="100" height="28" fill="#1890ff" rx="4"/>
  <text x="90" y="93" text-anchor="middle" font-family="Arial" font-size="10" fill="white">שמור שינויים</text>

  <!-- JSON Schema Editor area -->
  <rect x="30" y="140" width="640" height="280" fill="#fafafa" stroke="#d9d9d9" rx="4"/>

  <!-- Editor toolbar -->
  <rect x="30" y="140" width="640" height="30" fill="#f0f0f0" stroke="#d9d9d9" rx="4 4 0 0"/>
  <text x="650" y="160" text-anchor="end" font-family="Arial" font-size="10" fill="#666">Tree</text>
  <text x="600" y="160" text-anchor="end" font-family="Arial" font-size="10" fill="#1890ff">Text</text>

  <!-- JSON content (stays LTR as it's code) -->
  <text x="50" y="195" font-family="monospace" font-size="11" fill="#333">{</text>
  <text x="70" y="215" font-family="monospace" font-size="11" fill="#a626a4">"$schema"</text>
  <text x="148" y="215" font-family="monospace" font-size="11" fill="#333">:</text>
  <text x="158" y="215" font-family="monospace" font-size="11" fill="#50a14f">"https://json-schema.org/draft/2020-12/schema"</text>
  <text x="70" y="235" font-family="monospace" font-size="11" fill="#a626a4">"type"</text>
  <text x="118" y="235" font-family="monospace" font-size="11" fill="#333">:</text>
  <text x="128" y="235" font-family="monospace" font-size="11" fill="#50a14f">"object"</text>
  <text x="70" y="255" font-family="monospace" font-size="11" fill="#a626a4">"properties"</text>
  <text x="158" y="255" font-family="monospace" font-size="11" fill="#333">: {</text>
  <text x="90" y="275" font-family="monospace" font-size="11" fill="#a626a4">"id"</text>
  <text x="120" y="275" font-family="monospace" font-size="11" fill="#333">: {</text>
  <text x="138" y="275" font-family="monospace" font-size="11" fill="#a626a4">"type"</text>
  <text x="186" y="275" font-family="monospace" font-size="11" fill="#333">:</text>
  <text x="196" y="275" font-family="monospace" font-size="11" fill="#50a14f">"string"</text>
  <text x="255" y="275" font-family="monospace" font-size="11" fill="#333">},</text>
  <text x="90" y="295" font-family="monospace" font-size="11" fill="#a626a4">"name"</text>
  <text x="136" y="295" font-family="monospace" font-size="11" fill="#333">: {</text>
  <text x="154" y="295" font-family="monospace" font-size="11" fill="#a626a4">"type"</text>
  <text x="202" y="295" font-family="monospace" font-size="11" fill="#333">:</text>
  <text x="212" y="295" font-family="monospace" font-size="11" fill="#50a14f">"string"</text>
  <text x="271" y="295" font-family="monospace" font-size="11" fill="#333">}</text>

  <!-- Note about LTR code -->
  <text x="620" y="390" text-anchor="end" font-family="Arial" font-size="9" fill="#999">JSON/code stays LTR</text>

  <text x="350" y="440" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Placeholder - Replace with actual screenshot</text>
</svg>
