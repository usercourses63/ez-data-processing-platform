<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="10" y="10" width="580" height="380" fill="white" stroke="#d9d9d9" rx="8"/>
  <text x="300" y="40" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">BasicInfoTab - LTR Mode</text>

  <!-- Name field -->
  <text x="30" y="80" font-family="Arial" font-size="12" fill="#666">Name *</text>
  <rect x="30" y="90" width="250" height="32" fill="white" stroke="#d9d9d9" rx="4"/>

  <!-- Supplier field -->
  <text x="310" y="80" font-family="Arial" font-size="12" fill="#666">Supplier Name *</text>
  <rect x="310" y="90" width="250" height="32" fill="white" stroke="#d9d9d9" rx="4"/>

  <!-- Category dropdown -->
  <text x="30" y="150" font-family="Arial" font-size="12" fill="#666">Category *</text>
  <rect x="30" y="160" width="250" height="32" fill="white" stroke="#d9d9d9" rx="4"/>

  <!-- Retention field -->
  <text x="310" y="150" font-family="Arial" font-size="12" fill="#666">Retention (days)</text>
  <rect x="310" y="160" width="250" height="32" fill="white" stroke="#d9d9d9" rx="4"/>

  <!-- Description -->
  <text x="30" y="220" font-family="Arial" font-size="12" fill="#666">Description</text>
  <rect x="30" y="230" width="530" height="80" fill="white" stroke="#d9d9d9" rx="4"/>

  <!-- Active toggle -->
  <text x="30" y="340" font-family="Arial" font-size="12" fill="#666">Status</text>
  <rect x="30" y="350" width="50" height="24" fill="#1890ff" rx="12"/>
  <circle cx="67" cy="362" r="10" fill="white"/>

  <text x="300" y="390" text-anchor="middle" font-family="Arial" font-size="10" fill="#999">Placeholder - Replace with actual screenshot</text>
</svg>
