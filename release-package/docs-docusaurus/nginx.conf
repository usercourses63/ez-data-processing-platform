server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    autoindex off;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static assets - serve directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|xml)$ {
        try_files $uri =404;
    }

    # HTML files - serve directly
    location ~* \.html$ {
        try_files $uri =404;
    }

    # Clean URLs: /docs/admin -> /docs/admin.html
    # Fallback to docs.html for SPA client-side routing
    location / {
        try_files $uri $uri.html /docs.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
