server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to /docs/ with JavaScript fallback for port preservation
    location = / {
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./docs/"></head><body><script>window.location.href="./docs/";</script></body></html>';
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /docs/index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
