# DataSourceManagementService - Kubernetes Deployment
# Week 2: Day 2
# Replicas: 2 (API service, moderate scaling)
# Updated: Phase 02-06 - Added NAS device management RBAC

apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasource-management
  namespace: ez-platform
  labels:
    app: datasource-management
    component: api
    tier: backend
    nas-management: "enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datasource-management
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: datasource-management
        component: api
        tier: backend
    spec:
      # ServiceAccount with RBAC permissions for NAS device PV/PVC management
      serviceAccountName: nas-device-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: datasource-management
        image: ez-platform/datasource-management:v0.3.0-health-tcp2
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 5001
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:5001"
        - name: ConnectionStrings__MongoDB
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: mongodb-connection
        # Kubernetes configuration for NAS device management
        - name: Kubernetes__Namespace
          value: "ez-platform"
        - name: Kubernetes__Context
          value: "minikube"  # Ignored in-cluster, useful for local dev
        - name: OpenTelemetry__OtlpEndpoint
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: otlp-endpoint
        resources:
          requests:
            cpu: "50m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "3Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: nfs-test-data
          mountPath: /mnt/nfs-data
      volumes:
      - name: nfs-test-data
        persistentVolumeClaim:
          claimName: data-input-pvc
      restartPolicy: Always
