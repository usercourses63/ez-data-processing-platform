# EZ Platform Documentation - Kubernetes Deployment
# Docusaurus static site with deployment troubleshooting guide
# OCP Compatible: Non-root user, port 8080, security context

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ezplatform-docs
  namespace: ez-platform
  labels:
    app: ezplatform-docs
    component: documentation
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ezplatform-docs
  template:
    metadata:
      labels:
        app: ezplatform-docs
        component: documentation
        tier: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ezplatform-docs
        image: docs-docusaurus:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-log
          mountPath: /var/log/nginx
      volumes:
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-log
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ezplatform-docs
  namespace: ez-platform
  labels:
    app: ezplatform-docs
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30800
    name: http
  selector:
    app: ezplatform-docs
