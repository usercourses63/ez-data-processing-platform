# CI Pipeline for EZ Platform
# Triggers on push to main and PRs targeting main
# Multi-job pipeline: build -> test -> docker
#
# Requirements addressed:
# - TEST-05: Test quality gates in CI pipeline
# - CD-03: GitHub Actions workflow on push/PR to main
# - CD-07: SemVer+Build# version injection
# - CD-08: Commit SHA injection

name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  SEMANTIC_VERSION: '0.2.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests (Shared.Tests)
        run: |
          dotnet test tests/Shared.Tests \
            --no-restore \
            --logger trx \
            --results-directory TestResults/Shared \
            --verbosity normal

      - name: Run integration tests (non-infrastructure)
        run: |
          dotnet test tests/IntegrationTests \
            --filter "TestCategory!=Infrastructure" \
            --no-restore \
            --logger trx \
            --results-directory TestResults/Integration \
            --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/**/*.trx
          retention-days: 30

  performance:
    name: k6 SLO Smoke Test
    needs: test
    # Only run on push/PR to main, never on tags
    if: >
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      (github.ref == 'refs/heads/main' || github.base_ref == 'main') &&
      !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Stack is not available in CI — record results but don't block the pipeline
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run k6 smoke test
        run: |
          mkdir -p k6-results
          k6 run tests/performance/smoke.js \
            -e BASE_URL=http://localhost:5001 \
            -e METRICS_URL=http://localhost:5002 \
            -e VALIDATION_URL=http://localhost:5003 \
            --out json=k6-results/smoke-${{ github.run_number }}.json \
            2>&1 | tee k6-results/smoke-${{ github.run_number }}.txt || true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results-${{ github.run_number }}
          path: k6-results/
          retention-days: 30

  docker:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v${{ env.SEMANTIC_VERSION }}.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_STEP_SUMMARY

      - name: Build Docker images
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          COMMIT_SHA: ${{ steps.version.outputs.COMMIT_SHA }}
        run: |
          pwsh -File scripts/build-all-images.ps1

      # Placeholder for push - will be enabled when registry is configured
      - name: Docker build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit SHA: ${{ steps.version.outputs.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- Images built: 10 (9 services + Docusaurus)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- datasource-management, validation, fileprocessor" >> $GITHUB_STEP_SUMMARY
          echo "- filediscovery, scheduling, output" >> $GITHUB_STEP_SUMMARY
          echo "- metrics-configuration, invalidrecords, frontend" >> $GITHUB_STEP_SUMMARY
          echo "- docusaurus (documentation portal)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Image push disabled until container registry configured." >> $GITHUB_STEP_SUMMARY

  helm-validate:
    needs: docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/ez-platform/

      - name: Template validation (default values)
        run: |
          helm template ez-platform helm/ez-platform/ \
            --values helm/ez-platform/values.yaml \
            > /dev/null

      - name: Template validation (local values)
        run: |
          helm template ez-platform helm/ez-platform/ \
            --values helm/ez-platform/values.yaml \
            --values helm/ez-platform/values-local.yaml \
            > /dev/null
        continue-on-error: true

  docker-build:
    name: Build and Export Docker Images
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v${{ env.SEMANTIC_VERSION }}-dev-${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

      - name: Build all application images and export tars
        run: |
          chmod +x scripts/build-all-images.sh
          bash scripts/build-all-images.sh \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ github.sha }}" \
            "dist/images/services"

      - name: Upload image tars artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image-tars-${{ github.run_number }}
          path: dist/images/services/
          retention-days: 7

  package-release:
    name: Assemble Deployment Package
    needs: docker-build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pkg_name: ${{ steps.assemble.outputs.PKG_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Download app image tars
        uses: actions/download-artifact@v4
        with:
          name: app-image-tars-${{ github.run_number }}
          path: dist/images/services/

      - name: Pull and export infrastructure images
        run: |
          chmod +x scripts/pull-infra-images.sh
          bash scripts/pull-infra-images.sh "dist/images/infrastructure"

      - name: Assemble deployment package
        id: assemble
        run: |
          chmod +x scripts/assemble-package.sh
          bash scripts/assemble-package.sh \
            "${{ needs.docker-build.outputs.version }}" \
            "dist"

      - name: Zip deployment package
        run: |
          PKG_NAME="${{ steps.assemble.outputs.PKG_NAME }}"
          cd dist && zip -r "${PKG_NAME}.zip" "${PKG_NAME}/"
          echo "Created: dist/${PKG_NAME}.zip"
          ls -lh "${PKG_NAME}.zip"

      - name: Upload deployment package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.assemble.outputs.PKG_NAME }}
          path: dist/${{ steps.assemble.outputs.PKG_NAME }}.zip
          retention-days: 90

  sanity-deploy:
    name: Deploy and Sanity Test
    needs: package-release
    # Only runs on self-hosted runner with Minikube cluster access
    if: >
      vars.EZ_K8S_RUNNER == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (for DemoDataGenerator)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (for Playwright sanity tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-release.outputs.pkg_name }}
          path: dist-pkg/

      - name: Unzip deployment package
        run: |
          cd dist-pkg
          ZIP_FILE=$(ls *.zip | head -1)
          echo "Unzipping $ZIP_FILE ..."
          unzip -q "$ZIP_FILE"
          PKG_DIR=$(ls -d deployment-*/ | head -1)
          echo "PKG_DIR=$PKG_DIR" >> $GITHUB_ENV
          echo "Package extracted: $PKG_DIR"

      - name: Load application images into Minikube
        run: |
          echo "Loading application service images..."
          PIDS=()
          for tar in dist-pkg/${PKG_DIR}images/services/*.tar; do
            echo "  Loading $tar ..."
            minikube image load "$tar" &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do
            wait "$pid" || { echo "ERROR: image load failed (pid $pid)"; exit 1; }
          done
          echo "All service images loaded."

      - name: Load infrastructure images into Minikube
        run: |
          echo "Loading infrastructure images..."
          PIDS=()
          for tar in dist-pkg/${PKG_DIR}images/infrastructure/*.tar; do
            echo "  Loading $tar ..."
            minikube image load "$tar" &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do
            wait "$pid" || { echo "ERROR: image load failed (pid $pid)"; exit 1; }
          done
          echo "All infrastructure images loaded."

      - name: Deploy via Helm
        run: |
          helm upgrade --install ez-platform ./helm/ez-platform \
            --namespace ez-platform \
            --create-namespace \
            --values helm/ez-platform/values-local.yaml \
            --wait \
            --timeout 15m
          echo "Helm deploy complete."
          kubectl get pods -n ez-platform

      - name: Wait for all pods ready
        run: |
          echo "Waiting for all pods to be Ready..."
          kubectl wait --for=condition=Ready pod --all \
            -n ez-platform \
            --timeout=300s || {
            echo "Pod readiness timeout — current state:"
            kubectl get pods -n ez-platform
            kubectl get events -n ez-platform --sort-by='.lastTimestamp' | tail -20
            exit 1
          }

      - name: Start port-forwards
        run: |
          # Start each required port-forward in background
          kubectl port-forward svc/datasource-management 5001:5001 -n ez-platform &
          kubectl port-forward svc/metrics-configuration 5002:5002 -n ez-platform &
          kubectl port-forward svc/validation 5003:5003 -n ez-platform &
          kubectl port-forward svc/scheduling 5004:5004 -n ez-platform &
          kubectl port-forward svc/invalidrecords 5007:5007 -n ez-platform &
          kubectl port-forward svc/fileprocessor 5008:5008 -n ez-platform &
          kubectl port-forward svc/output 5009:5009 -n ez-platform &
          kubectl port-forward svc/frontend 7000:8080 -n ez-platform &
          # Allow port-forwards to establish
          sleep 10
          echo "Port-forwards established."

      - name: Seed cluster with DemoDataGenerator
        run: |
          dotnet run --project tools/DemoDataGenerator \
            -- \
            --direct-connection \
            --api-url http://localhost:5001
          echo "DemoDataGenerator seeding complete."

      - name: Install Playwright dependencies
        run: |
          cd src/Frontend
          npm ci
          npx playwright install chromium --with-deps

      - name: Run @Sanity test suite
        run: |
          cd src/Frontend
          npm run test:e2e:sanity
        env:
          BASE_URL: http://localhost:7000
          CI: 'true'

      - name: Upload sanity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-test-results-${{ github.run_number }}
          path: src/Frontend/test-results/
          retention-days: 30

      - name: Sanity test summary
        if: always()
        run: |
          echo "## Sanity Deploy Results" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.package-release.outputs.pkg_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: ez-platform" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: @Sanity (SANITY-01 through SANITY-07)" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ez-platform >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
